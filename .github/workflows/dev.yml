name: Deploy Frontend (Dev)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
    
      - name: install ssh keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_DEV_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_DEV_HOST }} > ~/.ssh/known_hosts

      - name: connect & pull changes
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_DEV_HOST }} "cd ${{ secrets.DEV_WORK_DIR }} && rm -rf build && git checkout ${{ secrets.DEV_BRANCH }} && git reset --hard origin/main && git pull && exit"

      - name: cleanup ssh
        run: rm -rf ~/.ssh
