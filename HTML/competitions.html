<!DOCTYPE html>
<head>
    <title>Competitions</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <script src="competitionScreen.js" type="module" defer></script>
    <link rel="icon" href="/favicon.ico">
</head>

<body>
    <div id="navbar">
        <button id="backButton">⭠ Back</button>
        <h1 id="navbarTitle">Competitions</h1>
    </div>
    <div class="center">
       
    </div>
    </div>

</body>

<style>
    @font-face {
        font-family: Futura;
        src: url('./FONTS/futura_medium_condensed_bt.ttf');
    }

    @font-face {
        font-family: Barlow;
        src: url('./FONTS/BarlowCondensed-Medium.ttf');
    }

    * {
        font-weight: 500;
    }

    p {
        color: white;
        font-size: 25px;
        margin: 0;
        margin-top: auto;
        margin-bottom: auto;
        box-sizing: border-box;
    }

    body {
        font-family: Barlow, Futura, Arial, sans-serif;
        font-size: 20px;
        font-weight: 400;
        height: 100%;
        overflow-y: auto;
        background-color: #07071e;
        padding: 0;
        margin: 0;
    }

    .center {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    button {
        color: inherit;
        height: inherit;
        border: none;
        padding: 0;
        font: inherit;
        cursor: pointer;
        outline: inherit;
    }

    #navbar {
        position: fixed;
        z-index: 100;
        width: 100%;
        align-items: center;
        top: 0;
        display: flex;
        justify-content: space-around;
        height: 100px;
        background-color: rgba(42, 44, 71, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 2px 20px rgba(5, 6, 10, 0.5);
    }

    #navbarTitle {
        position: absolute;
        left: 50%;
        margin: auto;
        font-size: 50px;
        transform: translateX(-50%);
        color: white;
        padding-inline: 20px;
        text-align: center;
    }

    #backButton {
        cursor: pointer;
        transition: filter 250ms ease;
        font-family: Barlow;
        opacity: 100%;
        padding: 10px 20px;
        font-size: 25px;
        color: black;
        width: fit-content;
        height: 50px;
        line-height: 20px;
        background-color: white;
        border-radius: 10px;
        margin: 20px 20px;
        margin-right: auto;
        user-select: none;
        -webkit-user-select: none;
    }

    #backButton:hover {
        filter: brightness(0.7);
    }

    .container {
        position: absolute;
        top: 300px;
        padding: 5px;
        padding-left: 15px;
        padding-right: 15px;
        width: 80vw;
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 100px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        text-align: center;
    }


    h1 {
        text-align: center;
        Font-family: Barlow, Futura, sans-serif;
        color: rgb(255, 255, 255);
        font-size: 50px;
        margin-bottom: 12px;
    }

    h2 {
        text-align: left;
        Font-family: Barlow, Futura, sans-serif;
        color: rgb(255, 255, 255);
        font-size: 35px;
        margin-bottom: 10px;
    }

    #text {
        width: 75%;
        max-width: 1150px;
        padding: 40px 40px;
    }

    #parent {
        display: flex;
        justify-content: center;
        margin-top: 100px;
    }

    a:link {
        color: #FFFFFF;
    }

    a:visited {
        color: #FFFFFF;
    }

    a:hover {
        color: #FFFFFF;
    }

    @media all and (orientation: portrait) {
        #text {
            width: 80%;
        }

        h1 {
            font-size: 35px;
        }

        h2 {
            font-size: 30px;
        }

        p {
            font-size: 22px;
        }

        #navbarTitle {
            font-size: 27px;
        }

        #backButton {
            font-size: 20px;
            padding: 10px 10px;
        }
    }
</style>
