name: Deploy to Apache Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Install SSH client
      run: sudo apt-get install -y openssh-client

    - name: Create SSH directory and known_hosts file
      run: mkdir -p ~/.ssh && touch ~/.ssh/known_hosts

    - name: Add known hosts
      run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Configure SSH key
      run: echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa

    - name: Install Node.js and npm
      uses: actions/setup-node@v2
      with:
        node-version: '20.11.1'

    - name: Install Dependencies
      run: npm install

    - name: Build
      run: npm run build

    - name: Deployment
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        scp -r -i ~/.ssh/id_rsa * ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:openguessr/frontend
