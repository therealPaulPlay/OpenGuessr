name: Deploy Frontend (Dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
  
      - name: Install Dependencies
        run: npm install
  
      - name: Build
        run: npm run build
        
      - name: install ssh keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_DEV_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_DEV_HOST }} > ~/.ssh/known_hosts

      - name: Prepare Server for New Build
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_DEV_HOST }} "rm -rf ${{ secrets.DEV_WORK_DIR }}/new_build"
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_DEV_HOST }} "mkdir ${{ secrets.DEV_WORK_DIR }}/new_build"

      - name: Transfer New Build to Server
        run: scp -r ./build/* ${{ secrets.SSH_USER }}@${{ secrets.SSH_DEV_HOST }}:${{ secrets.DEV_WORK_DIR }}/new_build/

      - name: Switch to New Build
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_DEV_HOST }} "rm -rf ${{ secrets.DEV_WORK_DIR }}/build"
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_DEV_HOST }} "mv ${{ secrets.DEV_WORK_DIR }}/new_build ${{ secrets.DEV_WORK_DIR }}/build"

      - name: cleanup ssh
        run: rm -rf ~/.ssh
