<!DOCTYPE HTML>
<html lang="en-US">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <meta name="description"
    content="Free geoguessr alternative with unlimited free play - improve your geography skills by guessing the location on google street view.">

  <title>OpenGuessr - 404</title>

  <link rel="icon" href="../favicon.ico">

  <style>
    :root {
      --brand-color: #ff0808;
    }

    @font-face {
      font-family: Futura;
      src: url('../FONTS/futura_medium_condensed_bt.ttf');
    }

    @font-face {
      font-family: Barlow;
      src: url('../FONTS/BarlowCondensed-Medium.ttf');
    }

    html * {
      margin: 0;
      font-family: Barlow, Futura, sans-serif;
      color: white;
      background-color: rgb(4, 4, 15);
    }

    body {
      height: 100vh;
      overflow-y: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 70px;
      font-weight: 500;
      word-wrap: break-word;
    }

    p {
      text-align: center;
      margin-top: 40px;
      max-width: 400px;
      font-size: 30px;
    }

    a,
    a:hover,
    a:visited {
      text-decoration: none;
      color: white;
    }

    .returnButton {
      cursor: pointer;
      width: fit-content;
      font-size: 30px;
      padding: 15px 20px;
      text-align: center;
      white-space: nowrap;
      transition: transform 250ms ease;
      border-radius: 10px;
      user-select: none;
      -webkit-user-select: none;
      background-color: var(--brand-color);
      color: white;
      opacity: 100%;
      margin-top: 200px;
      box-shadow: 0 0 100px #ff08088a;
    }

    .returnButton:hover {
      transform: scale(1.05);
    }

    @media(max-width: 800px) {
      h1 {
        font-size: 50px;
      }

      .returnButton {
        font-size: 25px;
      }
    }

    @media(max-width: 500px) {
      h1 {
        font-size: 35px;
      }

      p {
        font-size: 15px;
      }

      .returnButton {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <h1>404 - Page not found.</h1>
  <p>The page you requested does not exist under this domain.</p>
  <a class="returnButton" href="/">Return to OpenGuessr</a>
</body>

</html>
