<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
    <link rel="icon" href="favicon.ico">
    <title>Leaderboard - OpenGuessr</title>
    <script type="module" src="userAPI.js"></script>
    <style>
        @font-face {
            font-family: Barlow;
            src: url('/FONTS/BarlowCondensed-Medium.ttf');
        }

        h1,
        h2,
        h3 {
            font-weight: 400;
        }

        p {
            color: white;
            font-size: 25px;
            margin: 0;
            margin-top: auto;
            margin-bottom: auto;
            box-sizing: border-box;
        }

        body {
            font-family: Barlow, Futura, Arial, sans-serif;
            font-size: 20px;
            font-weight: 400;
            height: 100%;
            overflow-y: auto;
            background-color: #0b0b1e;
            padding: 0;
            margin: 0;
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            color: inherit;
            height: inherit;
            border: none;
            padding: 0;
            font: inherit;
            cursor: pointer;
            outline: inherit;
        }

        #navbar {
            position: fixed;
            z-index: 100;
            width: 100%;
            align-items: center;
            top: 0;
            display: flex;
            justify-content: space-around;
            height: 100px;
            background-color: rgba(32, 32, 53, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(5, 6, 10, 0.5);
        }

        #navbarTitle {
            position: absolute;
            left: 50%;
            margin: auto;
            font-size: 50px;
            transform: translateX(-50%);
            color: white;
            padding-inline: 20px;
            text-align: center;
        }

        #backButton {
            cursor: pointer;
            transition: filter 250ms ease;
            font-family: Barlow;
            opacity: 100%;
            padding: 10px 20px;
            font-size: 25px;
            color: black;
            width: fit-content;
            height: 50px;
            line-height: 20px;
            background-color: white;
            border-radius: 10px;
            margin: 20px 20px;
            margin-right: auto;
            user-select: none;
            -webkit-user-select: none;
        }

        #backButton:hover {
            filter: brightness(0.7);
        }

        .container {
            padding: 2px;
            padding-left: 10px;
            padding-right: 10px;
            width: 80vw;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            text-align: center;
        }

        .yourContainer {
            padding: 0;
            padding-left: 10px;
            padding-right: 10px;
            width: 80vw;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            text-align: center;
        }

        .rankedItem {
            display: inline-block;
            width: 100%;
            height: 50px;
            box-sizing: border-box;
            background-color: rgba(201, 212, 255, 0.3);
            border-radius: 10px;
            margin: 10px 0px;
            display: flex;
            justify-content: space-around;
            padding: 0;
            padding-left: 30px;
            padding-right: 30px;
            white-space: nowrap;
            overflow: hidden;
        }

        .yourContainer .rankedItem {
            background-color: rgba(222, 228, 251, 0.4);
        }

        .middle {
            margin-right: auto;
            margin-left: auto;
            transition: opacity 250ms ease;
            cursor: pointer;
            user-select: none;
        }

        .middle:hover {
            opacity: 0.5;
        }

        .gold {
            background-color: #caa128;
        }

        .silver {
            background-color: #898993;
        }

        .bronze {
            background-color: #803b3b;
        }

        .yourItem {
            border: solid 5px white;
        }

        .maxlength {
            max-width: 40%;
            text-overflow: none;
            overflow: hidden;
        }

        .directionArrowIcon {
            width: 25px;
            height: 25px;
            filter: invert();
            transform: rotate(90deg);
            vertical-align: -4px;
        }

        .leaderboardContainer {
            border-radius: 20px;
            background-color: rgba(92, 93, 94, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: calc(80vw + 50px);
            max-width: 850px;
            margin-top: 20px;
            padding: 15px;
            padding-inline: 0;
        }

        .podium-container {
            display: flex;
            justify-content: center;
            margin-top: 220px;
            margin-bottom: 30px;
        }

        .podium {
            display: flex;
            align-items: flex-end;
            height: 250px;
            width: 70vw;
            max-width: 650px;
            gap: 20px;
        }

        .podium-item {
            flex-grow: 1;
            margin: 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 15px;
            cursor: pointer;
            transition: filter 250ms ease;
            outline: 10px solid rgba(255, 255, 255, 0.1);
            max-width: 30%;
        }

        .podium-item:hover {
            filter: brightness(1.2);
        }

        #first-place {
            height: 200px;
            flex-grow: 1.5;
        }

        #second-place {
            height: 170px;
        }

        #third-place {
            height: 140px;
        }

        .podium-item .name {
            padding: 5px;
            text-align: center;
            color: white;
            font-size: 25px;
            word-break: break-word;
            max-width: 100%;
            position: relative;
            top: -55px;
            overflow: hidden;
            text-overflow: ellipsis;
            text-wrap: nowrap;
        }

        .podium-item .rank {
            font-size: 30px;
            color: white;
            margin-top: auto;
            margin-bottom: 20px;
        }

        @media all and (orientation: portrait) {
            #navbarTitle {
                font-size: 27px;
            }

            #backButton {
                font-size: 20px;
                padding: 10px 10px;
            }

            .directionArrowIcon {
                vertical-align: -5px;
            }

            p {
                font-size: 20px;
            }

            .podium-item .rank {
                font-size: 20px;
            }

            .podium-item .name {
                font-size: 25px;
            }

            #first-place {
                height: 120px;
            }

            #second-place {
                height: 90px;
            }

            #third-place {
                height: 70px;
            }

            .podium {
                width: 85vw;
                height: 110px;
                gap: 0;
            }

            .podium-item {
                outline-width: 5px;
            }

            .podium-item .name {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div id="navbar">
        <button id="backButton">
            <img id="backArrow" src="/IMG/arrow_icon.png" alt="Expand or close arrow" class="directionArrowIcon">
            Back</button>
        <h1 id="navbarTitle">Leaderboard</h1>
    </div>
    <div class="podium-container">
        <div class="podium">
            <div class="podium-item silver" id="second-place">
                <div class="name"></div>
                <div class="rank">#2</div>
            </div>
            <div class="podium-item gold" id="first-place">
                <div class="name"></div>
                <div class="rank">#1</div>
            </div>
            <div class="podium-item bronze" id="third-place">
                <div class="name"></div>
                <div class="rank">#3</div>
            </div>
        </div>
    </div>
    <div class="center">
        <div class="leaderboardContainer" id="leaderboardContainer">
            <div class="yourContainer">
                <div class="rankedItem">
                    <p id="yourRank">You: </p>
                    <p id="yourName" class="middle">Loading name</p>
                    <p id="yourExperience"></p>
                </div>
            </div>
            <div id="container" class="container"></div>
        </div>
    </div>

</body>
<script type="module">
    import { getAllUsers } from "./userAPI.js";

    // Back Button and iframe check -------------------------------------------------------------------------------------------
    function inIframe() {
        try {
            return window.self !== window.top;
        } catch (e) {
            return true;
        }
    }

    document.getElementById("backButton").addEventListener("click",
        function () {
            if (inIframe()) {
                window.top.postMessage("close", "*");
            } else {
                window.location.href = "/index.html";
            }
        }
    );

    // Load local data ----------------------------------------------------------------------------------------------------------
    let yourUsername = localStorage.getItem("username") != null ? localStorage.getItem("username") : "Not signed in";
    document.getElementById("yourName").innerHTML = yourUsername;

    let dontLoadStats = false;

    //dont load the stats if the user is not signed in 
    if (localStorage.getItem("username") == null) {
        dontLoadStats = true;
    }

    //get experience from localstorage in case it isn't being returned by the request
    if (localStorage.getItem("experience") != null && !dontLoadStats) {
        document.getElementById("yourExperience").innerHTML = Number(localStorage.getItem("experience")).toLocaleString() + " XP";
    }

    if (localStorage.getItem("id") != null) {
        document.getElementById("yourName").addEventListener("click", () => {
            openProfile(localStorage.getItem("id"));
        });
    }

    // open profile -----------------------------------------------------------------------------------------------------------------

    function openProfile(id) {
        if (inIframe()) {
            window.top.postMessage("profile" + id, "*");
        } else {
            window.location.href = "/index.html?profile=" + id;
        }
    }

    // Add leaderboar entries --------------------------------------------------------------------------------------------------------
    let container = document.getElementById('container');

    // Function to add a new ranked item to the leaderboard
    let idCounter = 0;

    function addRankedItem(rank, name, xp, id) {
        idCounter++;
        const rankedItem = document.createElement('div');
        rankedItem.classList.add('rankedItem');

        //draw outline around your rank (if it is on the leaderboard)
        if (name == yourUsername && !dontLoadStats) {
            rankedItem.classList.add('yourItem');
        }

        switch (rank) {
            case 1: rankedItem.classList.add('gold');
                break;
            case 2: rankedItem.classList.add('silver');
                break;
            case 3: rankedItem.classList.add('bronze');
                break;
        }

        rankedItem.innerHTML = `
                <p class="maxlength">#${rank}</p>
                <p id="name${idCounter}" class="middle maxlength">${name}</p>
                <p class="maxlength">${xp} XP</p>
            `;

        container.appendChild(rankedItem);

        document.getElementById("name" + idCounter).addEventListener("click", () => {
            openProfile(id);
        });
    }


    // Load leaderboard data -------------------------------------------------------------------------------------------------------
    async function loadLeaderboard() {
        container.innerHTML = "<p>Loading...</p>";

        let data = await getAllUsers();
        let userData = data;

        if (userData.user) {
            userData = data.experienceLeaderboard;
        }

        if (userData == undefined) {
            container.innerHTML = "<p>An error occurred while loading the leaderboard.</p>";
        } else {
            container.innerHTML = "";

            // Populate podium
            for (let i = 0; i < 3 && i < userData.length; i++) {
                let user = userData[i];
                let place = ['first', 'second', 'third'][i];
                let podiumItem = document.getElementById(`${place}-place`);
                podiumItem.querySelector('.name').textContent = user.user_name;
                podiumItem.addEventListener('click', () => openProfile(user.id));
            }

            // Populate main leaderboard starting from 4th place
            for (let i = 3; i < userData.length; i++) {
                let user = userData[i];
                let userName = user.user_name;
                let experience = Number(user.experience).toLocaleString();
                let id = user.id;

                addRankedItem(i + 1, userName, experience, id);
            }

            if (data.user && !dontLoadStats) {
                document.getElementById("yourExperience").innerHTML = Number(data.user.experience).toLocaleString() + " XP";
                document.getElementById("yourRank").innerHTML = "#" + (data.user.position);
            }
        }

        document.body.style.height = document.documentElement.scrollHeight + 100 + 'px';
    }

    loadLeaderboard();

    //Google Analytics 4 (simplified implementation) -------------------------------------------------------------------------
    window['gtag_enable_tcf_support'] = true;

    const imported = document.createElement('script');
    imported.src = "https://www.googletagmanager.com/gtag/js?id=G-DXD64B7ZDX";
    document.head.appendChild(imported);

    try {
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }

        gtag('js', new Date());

        gtag('config', 'G-DXD64B7ZDX', {
            cookie_domain: location.hostname,
            cookie_flags: "SameSite=None; Secure",
        });
    } catch (error) {
        console.error("Error loading GA4: " + error);
    }


</script>

</html>
