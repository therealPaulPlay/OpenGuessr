<!DOCTYPE HTML>
<html>
    <head>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.8.0/leaflet.css" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.8.0/leaflet.js"></script>
        <script src="https://unpkg.com/mathjs@11.5.1/lib/browser/math.js"></script>
        <title>OpenGuessr</title>
        <link rel="stylesheet" href="CSS/guesser.css">
        <link rel="icon" type="image/x-icon" href="IMG/favicon.svg">
    </head> 
    <body>
        <div class="Banner">
            <a id = "logo"><img id="icon" src="IMG/openguessr.svg"></a>
            <br>
            <br>
        </div>
        <div id="BeforeOverlay">
            <br>
        </div>
        <div id="EndOverlay">
            <div id="TextDiv">
                <p id="distanceText"></p>
                <p id="motivationText"></p>
                <div id="mapAndNewRound"></div>
                <div id="resultMap"></div>
                <br>
                <button id="nextRound"><a>next round</a></button>
            </div>
            <br>
            <br>
        </div>
        <!--streetview-->
        <div class="MainDiv">
            <iframe id="GuesserWindow" src="https://www.google.com/maps/embed?pb=!4v1676316391332!6m8!1m7!1s-F0-n2PVoUNu8NPn2HG1Aw!2m2!1d3.012222359652991!2d101.4514473096548!3f147!4f5!5f0.8160813932612223" width="1920" height="1080" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>         
            <!--map-->
            <div id="map"></div>
            <script>
                //this is so we don't get a duplicate map declaration. Simply removes the old one.
                var map = L.map('map');
                map.off();
                map.remove();
            </script>
            <!--bottom toolbar with reset button-->
            <div class="BottomBar">
                <img id="resetButtonSVG" src="IMG/reset.svg">
                <img id="confirmButton" src="IMG/confirm.svg">
            </div>
            <!--load main script-->
            <script type="module" src="JS/loadMap.js"></script>
            <script type="module" src="JS/main.js"></script>
        </div>
    </body>
</html>
