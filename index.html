<!DOCTYPE HTML>
<html>
    <head>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.8.0/leaflet.css" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.8.0/leaflet.js"></script>
        <script src="https://unpkg.com/mathjs@11.5.1/lib/browser/math.js"></script>
        <title>OpenGuessr</title>
        <link rel="stylesheet" href="CSS/guesser.css">
        <link rel="icon" type="image/x-icon" href="IMG/favicon.svg">
    </head> 
    <body>
        <div class="Banner">
            <a id = "logo"><img id="icon" src="IMG/openguessr.svg" onclick="generateNewLocation();"></a>
            <br>
            <br>
        </div>
        <div id="BeforeOverlay">
            <br>
        </div>
        <div id="EndOverlay">
            <div id="TextDiv">
                <p id="distanceText"></p>
                <p id="motivationText"></p>
                <div id="mapAndNewRound"></div>
                <div id="resultMap"></div>
                <br>
                <button id="nextRound"><a onclick="transitionToStart()">next round</a></button>
            </div>
            <br>
            <br>
        </div>
        <!--streetview-->
        <div class="MainDiv">
            <iframe id="GuesserWindow" src="https://www.google.com/maps/embed?pb=!!6m8!1m7!!2m2!!!!!" width="1920" height="1080" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>         
            <!--map-->
            <div id="map"></div>
            
            <script>
                const key = 'QADiAuIEfpISv0PGS7Ju';
                const map = L.map('map').setView([35.321160, -40.252812], 1.5); //starting position
                L.tileLayer(`https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=${key}`,{ //style URL
                    tileSize: 512,
                    zoomOffset: -1,
                    minZoom: 1,
                    //attribution: "\u003ca href=\"https://www.maptiler.com/copyright/\" target=\"_blank\"\u003e\u0026copy; MapTiler\u003c/a\u003e \u003ca href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\"\u003e\u0026copy; OpenStreetMap contributors\u003c/a\u003e",
                    crossOrigin: true
                }).addTo(map);

                var redIcon = new L.Icon({
                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34],
                    shadowSize: [41, 41]
                });

                var marker = new L.Marker([0, 0]);
                var markerPosition = marker.getLatLng();
                var lat;
                var long;

                function onMapClick(e) {
                    if (marker) {
                        map.removeLayer(marker);
                    }
                    lat = e.latlng.lat;
                    long = e.latlng.lng;

                    marker = new L.Marker([lat, long], {icon: redIcon});

                    markerPosition = marker.getLatLng();
                    marker.addTo(map);
                }

                map.on('click', onMapClick);
            </script>
            <!--bottom toolbar with reset button-->
            <div class="BottomBar">
                <img id="resetButtonSVG" src="IMG/reset.svg" onclick="reloadIframe(); clicked()">
                <img id="confirmButton" src="IMG/confirm.svg" onclick="calculateDistances(markerPosition.lat, markerPosition.lng);setMapToTargetPosition(key, lat, long)">
            </div>
            <!--load main script-->
            <script type="module" src="JS/main.js"></script>
        </div>
    </body>
</html>
