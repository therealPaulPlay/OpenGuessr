<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
    <link rel="icon" href="favicon.ico">
    <title>Leaderboard - OpenGuessr</title>
    <script type="module" src="userAPI.js"></script>
    <style>
        @font-face {
            font-family: Barlow;
            src: url('/FONTS/BarlowCondensed-Medium.ttf');
        }

        h1,
        h2,
        h3 {
            font-weight: 400;
        }

        p {
            color: white;
            font-size: 25px;
            margin: 0;
            margin-top: auto;
            margin-bottom: auto;
            box-sizing: border-box;
        }

        body {
            font-family: Barlow, Futura, Arial, sans-serif;
            font-size: 20px;
            font-weight: 400;
            height: 100%;
            overflow-y: auto;
            background-color: #11121f;
            padding: 0;
            margin: 0;
        }

        .standardButton {
            cursor: pointer;
            width: fit-content;
            font-size: 22px;
            padding: 10px 20px;
            min-height: 35px;
            text-align: center;
            white-space: nowrap;
            transition: filter 250ms ease, box-shadow 250ms ease;
            margin: 2.5px;
            border-radius: 5px;
            user-select: none;
            -webkit-user-select: none;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            opacity: 100%;
        }

        .standardButton:hover {
            filter: brightness(0.7);
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        button {
            color: inherit;
            height: inherit;
            border: none;
            padding: 0;
            font: inherit;
            cursor: pointer;
            outline: inherit;
        }

        #navbar {
            position: fixed;
            z-index: 100;
            width: 100%;
            align-items: center;
            top: 0;
            display: flex;
            justify-content: space-around;
            height: 100px;
            background-color: rgba(31, 33, 52, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(5, 6, 10, 0.5);
        }

        #navbarTitle {
            position: absolute;
            left: 50%;
            margin: auto;
            font-size: 50px;
            transform: translateX(-50%);
            color: white;
            padding-inline: 20px;
            text-align: center;
        }

        #backButton {
            cursor: pointer;
            transition: filter 250ms ease;
            font-family: Barlow;
            opacity: 100%;
            padding: 10px 20px;
            font-size: 25px;
            color: black;
            width: fit-content;
            height: 50px;
            line-height: 20px;
            background-color: white;
            border-radius: 10px;
            margin: 20px 20px;
            margin-right: auto;
            user-select: none;
            -webkit-user-select: none;
        }

        #backButton:hover {
            filter: brightness(0.7);
        }

        .optionBar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px !important;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .optionLabel {
            padding: 5px;
            padding-inline: 10px;
            background-color: rgba(17, 18, 31, 0.25);
            border-radius: 7px;
            min-height: 25px;
            margin: 0;
            height: 100%;
        }

        .optionButton {
            border-radius: 7px;
            min-height: 25px;
            margin: 0;
            padding: 5px;
            padding-inline: 10px;
            height: 100%;
        }

        .optionButtonSelected {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .container {
            padding: 2px;
            padding-left: 10px;
            padding-right: 10px;
            width: 80vw;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            background-color: rgba(189, 200, 233, 0.1);
            border-radius: 13px;
            text-align: center;
        }

        .rankedItem {
            width: 100%;
            height: 45px;
            box-sizing: border-box;
            background-color: rgba(213, 221, 255, 0.2);
            border-radius: 8px;
            margin: 10px 0px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0;
            padding-inline: 25px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 250ms ease;
        }

        .rankedItemSupporter {
            background-color: rgba(137, 255, 183, 0.35);
            box-sizing: border-box;
            border: 4px solid rgba(137, 255, 183, 0.35);
            position: relative;
        }

        .rankedItemSupporter::before {
            animation: supporterGlint 5s 2s infinite;
            background: linear-gradient(90deg, #00ff1c00 1%, #73ff96 50%, #00ff3400);
            border-radius: inherit;
            content: "";
            height: 4px;
            inset: -4px;
            opacity: 0;
            position: absolute;
            transform: translate(0);
            width: 50%;
            z-index: 1;
        }

        @keyframes supporterGlint {
            10% {
                opacity: 1
            }

            20% {
                opacity: 0;
                transform: translate(100%)
            }

            21% {
                opacity: 0;
                transform: translate(100%, 41px)
            }

            30% {
                opacity: 1
            }

            40% {
                opacity: 0;
                transform: translateY(41px)
            }

            41% {
                opacity: 0;
                transform: translate(0)
            }

            50% {
                opacity: 1
            }

            60% {
                opacity: 0;
                transform: translate(100%)
            }
        }

        .middle {
            transition: opacity 250ms ease;
            cursor: pointer;
            user-select: none;
        }

        .middle:hover {
            opacity: 0.5;
        }

        .gold {
            background-color: #caa128;
        }

        .silver {
            background-color: #898993;
        }

        .bronze {
            background-color: #803b3b;
        }

        .yourItem {
            border: solid 5px white;
        }

        .maxlength {
            max-width: 40%;
            text-overflow: ellipsis;
            overflow: hidden;
            flex-grow: 1;
            flex-basis: 0;
        }

        .rankedItemLeft {
            text-align: left;
        }

        .rankedItemRight {
            text-align: right
        }

        .directionArrowIcon {
            width: 25px;
            height: 25px;
            filter: invert();
            transform: rotate(90deg);
            vertical-align: -4px;
        }

        .leaderboardContainer {
            border-radius: 25px;
            background-color: rgba(92, 93, 94, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: calc(80vw + 50px);
            max-width: 850px;
            margin-top: 20px;
            padding: 15px;
            padding-inline: 0;
        }

        .podium-container {
            display: flex;
            justify-content: center;
            margin-top: 220px;
            margin-bottom: 30px;
        }

        .podium {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 250px;
            width: 70vw;
            max-width: 650px;
            gap: 20px;
            position: relative;
            transform: scale(0.9);
            opacity: 0.3;
            transition: opacity 250ms ease, transform 250ms ease;
        }

        .podium-item {
            flex-grow: 1;
            margin: 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 15px;
            cursor: pointer;
            transition: filter 250ms ease, height 250ms ease, width 250ms ease;
            outline: 10px solid rgba(92, 93, 94, 0.1);
            max-width: 25%;
        }

        .podium-item:hover {
            filter: brightness(1.2);
        }

        #first-place {
            height: 200px;
            flex-grow: 1.5;
        }

        #second-place {
            height: 170px;
        }

        #third-place {
            height: 140px;
        }

        .podium-item .name {
            padding: 5px;
            text-align: center;
            color: white;
            font-size: 25px;
            word-break: break-word;
            max-width: 100%;
            position: relative;
            top: -55px;
            overflow: hidden;
            text-overflow: ellipsis;
            text-wrap: nowrap;
        }

        .podium-item .rank {
            font-size: 30px;
            color: white;
            margin-bottom: 20px;
        }

        .podium-item .podiumExp {
            font-size: 25px;
            color: white;
            margin-top: auto;
            margin-bottom: auto;
            max-width: 17vw;
            overflow: hidden;
            text-overflow: ellipsis;
            text-wrap: nowrap;
            opacity: 0.75;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0.1);
            padding-inline: 5px;
        }

        #yourLeagueContainer {
            margin-top: 25px;
            min-height: 30px;
            display: none;
        }

        .threeDotsContainer {
            width: 80vw;
            max-width: 800px;
            overflow: hidden;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            display: flex;
        }

        #threeDotsContainer {
            display: none;
        }

        .circleDot {
            padding: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
        }

        @media all and (orientation: portrait) {
            #navbarTitle {
                font-size: 27px;
            }

            #backButton {
                font-size: 20px;
                padding: 10px 10px;
            }

            .directionArrowIcon {
                vertical-align: -5px;
            }

            p,
            .optionButton {
                font-size: 20px;
            }

            .podium-item .rank {
                font-size: 20px;
            }

            .podium-item .name {
                font-size: 25px;
            }

            .podium-item .podiumExp {
                font-size: 18px;
            }

            #first-place {
                height: 160px;
            }

            #second-place {
                height: 130px;
            }

            #third-place {
                height: 110px;
            }

            .podium {
                width: 85vw;
                height: 150px;
                gap: 10px;
            }

            .podium-item .name {
                font-size: 20px;
            }

            .maxlength {
                flex-basis: unset;
            }
        }
    </style>
</head>

<body>
    <div id="navbar">
        <button id="backButton">
            <img id="backArrow" src="/IMG/arrow_icon.png" alt="Expand or close arrow" class="directionArrowIcon">
            Back</button>
        <h1 id="navbarTitle">Leaderboard</h1>
    </div>
    <div class="podium-container">
        <div id="podium" class="podium">
            <div class="podium-item silver" id="second-place">
                <div class="name"></div>
                <div class="podiumExp"></div>
                <div class="rank">#2</div>
            </div>
            <div class="podium-item gold" id="first-place">
                <div class="name"></div>
                <div class="podiumExp"></div>
                <div class="rank">#1</div>
            </div>
            <div class="podium-item bronze" id="third-place">
                <div class="name"></div>
                <div class="podiumExp"></div>
                <div class="rank">#3</div>
            </div>
        </div>
    </div>
    <div class="center">
        <div class="optionBar container">
            <p class="optionLabel">Filter:</p>
            <button id="filterAll" class="standardButton optionButton">All</button>
            <button id="filterSupporter" class="standardButton optionButton">Supporters</button>
        </div>
        <div class="leaderboardContainer" id="leaderboardContainer">
            <div id="container" class="container"></div>
            <div id="threeDotsContainer" class="threeDotsContainer">
                <div class="circleDot"></div>
                <div class="circleDot"></div>
                <div class="circleDot"></div>
            </div>
            <div id="yourLeagueContainer" class="container"></div>
        </div>
    </div>

</body>
<script type="module">
    import { getLeaderboard, getSupporterLeaderboard } from "./userAPI.js";

    // Back Button and iframe check -------------------------------------------------------------------------------------------
    function inIframe() {
        try {
            return window.self !== window.top;
        } catch (e) {
            return true;
        }
    }

    document.getElementById("backButton").addEventListener("click",
        function () {
            if (inIframe()) {
                window.top.postMessage("close", "*");
            } else {
                window.location.href = "/index.html";
            }
        }
    );

    // Check for login status ----------------------------------------------------------------------------------------------------------

    let dontLoadStats = false;

    if (localStorage.getItem("id") == null) {
        dontLoadStats = true;
    }

    // open profile -----------------------------------------------------------------------------------------------------------------

    function openProfile(id) {
        if (inIframe()) {
            window.top.postMessage("profile" + id, "*");
        } else {
            window.location.href = "/index.html?profile=" + id;
        }
    }

    // Add leaderboar entries --------------------------------------------------------------------------------------------------------
    let container = document.getElementById('container');
    let yourLeagueContainer = document.getElementById("yourLeagueContainer");
    let yourUsername = localStorage.getItem("username");

    // Function to add a new ranked item to the leaderboard
    let idCounter = 0;

    let timeoutMultiplier = 0;

    function addRankedItem(rank, name, xp, id, supporterLevel, yourLeague) {
        idCounter++;
        const rankedItem = document.createElement('div');
        rankedItem.classList.add('rankedItem');

        //draw outline around your rank (if it is on the leaderboard)
        if (name == yourUsername && !dontLoadStats) {
            rankedItem.classList.add('yourItem');
        }

        if (supporterLevel && supporterLevel > 0) {
            rankedItem.classList.add("rankedItemSupporter");
        }

        rankedItem.innerHTML = `
                <p class="maxlength rankedItemLeft">#${rank}</p>
                <p id="name${idCounter}" class="middle maxlength">${name}</p>
                <p class="maxlength rankedItemRight">${xp} XP</p>
            `;

        if (!yourLeague) {
            container.appendChild(rankedItem);
        } else {
            yourLeagueContainer.appendChild(rankedItem);
        }

        timeoutMultiplier++;

        setTimeout(() => {
            rankedItem.style.opacity = "1";
        }, 10 * timeoutMultiplier);

        document.getElementById("name" + idCounter).addEventListener("click", () => {
            openProfile(id);
        });
    }


    // Load leaderboard data -------------------------------------------------------------------------------------------------------
    async function loadLeaderboard(leaderboardType) {
        container.innerHTML = "<p>Loading...</p>";
        yourLeagueContainer.innerHTML = "<p>Loading...</p>";
        yourLeagueContainer.style.display = "none";
        document.getElementById("threeDotsContainer").style.display = "none";
        document.body.style.height = "100vh";
        timeoutMultiplier = 0;

        let data;

        switch (leaderboardType) {
            case "experience":
                data = await getLeaderboard();
                break;
            case "experience-supporter":
                data = await getSupporterLeaderboard();
                break;
        }

        if (!data) {
            container.innerHTML = "<p>An error occurred while loading the leaderboard.</p>";
            return;
        }

        let userData = data;

        if (userData.experienceLeaderboard) {
            userData = data.experienceLeaderboard;
        }

        if (userData == undefined) {
            container.innerHTML = "<p>An error occurred while loading the leaderboard.</p>";
            yourLeagueContainer.innerHTML = "<p>An error occurred while loading the leaderboard.</p>";
        } else {
            container.innerHTML = "";
            yourLeagueContainer.innerHTML = "";

            // rest podium items to remove any previous event listeners
            document.querySelectorAll(".podium-item").forEach((e) => {
                const podiumItem = e;
                const newPodiumItem = podiumItem.cloneNode(true);
                podiumItem.parentNode.replaceChild(newPodiumItem, podiumItem);
            });

            // Populate podium
            for (let i = 0; i < 3 && i < userData.length; i++) {
                let user = userData[i];
                let place = ['first', 'second', 'third'][i];
                let podiumItem = document.getElementById(`${place}-place`);
                podiumItem.querySelector('.name').textContent = user.user_name;
                podiumItem.querySelector('.podiumExp').textContent = user.experience.toLocaleString() + " XP";
                podiumItem.addEventListener('click', () => openProfile(user.id));

                if (user.user_name == yourUsername && !dontLoadStats) {
                    podiumItem.classList.add('yourItem');
                }
            }

            document.getElementById("podium").style.opacity = 1;
            document.getElementById("podium").style.transform = "scale(1)";

            // Populate main leaderboard starting from 4th place
            for (let i = 3; i < userData.length; i++) {
                let user = userData[i];
                let userName = user.user_name;
                let experience = Number(user.experience).toLocaleString();
                let id = user.id;
                let supporterLevel = user.supporter_level;

                addRankedItem(user.position, userName, experience, id, supporterLevel);
            }

            if (data.userLeaderboard) {
                yourLeagueContainer.style.display = "block";
                document.getElementById("threeDotsContainer").style.display = "flex";

                for (let i = 0; i < data.userLeaderboard.length; i++) {
                    let user = data.userLeaderboard[i];
                    addRankedItem(user.position.toLocaleString(), user.user_name, Number(user.experience).toLocaleString(), user.id, user.supporter_level, true);
                }
            }
        }

        document.body.style.height = document.documentElement.scrollHeight - 100 + 'px';
    }

    // Filter / Sort Options -------------------------------------------------------------------------------------------------

    let filter = "all";

    function setFilterHighlight() {
        document.querySelectorAll(".optionButton").forEach((e) => {
            e.classList.remove("optionButtonSelected");
        });

        switch (filter) {
            case "all":
                document.getElementById("filterAll").classList.add("optionButtonSelected");
                loadLeaderboard("experience");
                break;
            case "supporter":
                document.getElementById("filterSupporter").classList.add("optionButtonSelected");
                loadLeaderboard("experience-supporter");
                break;
        }
    }

    document.getElementById("filterAll").addEventListener("click", () => {
        filter = "all";
        setFilterHighlight();
    });

    document.getElementById("filterSupporter").addEventListener("click", () => {
        filter = "supporter";
        setFilterHighlight();
    });

    setFilterHighlight();

    //Google Analytics 4 (simplified implementation) -------------------------------------------------------------------------
    window['gtag_enable_tcf_support'] = true;

    const imported = document.createElement('script');
    imported.src = "https://www.googletagmanager.com/gtag/js?id=G-DXD64B7ZDX";
    document.head.appendChild(imported);

    try {
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }

        gtag('js', new Date());

        gtag('config', 'G-DXD64B7ZDX', {
            cookie_domain: location.hostname,
            cookie_flags: "SameSite=None; Secure",
        });
    } catch (error) {
        console.error("Error loading GA4: " + error);
    }


</script>

</html>
