<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <link rel="icon" href="favicon.ico">
    <title>Leaderboard - OpenGuessr</title>
    <script type="module" src="userAPI.js"></script>
    <style>
        @font-face {
            font-family: Barlow;
            src: url('/FONTS/BarlowCondensed-Medium.ttf');
        }

        h1,
        h2,
        h3 {
            font-weight: 400;
        }

        p {
            color: white;
            font-size: 25px;
            margin: 0;
            margin-top: auto;
            margin-bottom: auto;
            box-sizing: border-box;
        }

        body {
            font-family: Barlow, Futura, Arial, sans-serif;
            font-size: 20px;
            font-weight: 400;
            height: 100%;
            overflow-y: auto;
            background-color: #07071e;
            padding: 0;
            margin: 0;
        }

        #center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            color: inherit;
            height: inherit;
            border: none;
            padding: 0;
            font: inherit;
            cursor: pointer;
            outline: inherit;
        }

        #navbar {
            position: sticky;
            z-index: 100;
            width: 100%;
            align-items: center;
            top: 0;
            display: flex;
            justify-content: space-around;
            height: 100px;
            background-color: rgba(42, 44, 71, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(5, 6, 10, 0.5);
        }

        #navbarTitle {
            position: absolute;
            left: 50%;
            margin: auto;
            font-size: 50px;
            transform: translateX(-50%);
            color: white;
        }

        #backButton {
            cursor: pointer;
            transition: all 250ms ease;
            font-family: Barlow;
            opacity: 100%;
            padding: 10px 20px;
            font-size: 25px;
            color: black;
            width: fit-content;
            height: fit-content;
            background-color: white;
            border-radius: 10px;
            margin: 20px 20px;
            margin-right: auto;
            user-select: none;
            -webkit-user-select: none;
        }

        #backButton:hover {
            filter: brightness(0.7);
        }

        #container {
            position: absolute;
            top: 150px;
            padding: 5px;
            padding-left: 15px;
            padding-right: 15px;
            width: 80vw;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 100px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            text-align: center;
        }

        .rankedItem {
            display: inline-block;
            width: 100%;
            height: 50px;
            box-sizing: border-box;
            background-color: #4f506f;
            border-radius: 10px;
            margin: 10px 0px;
            display: flex;
            justify-content: space-around;
            padding: 0;
            padding-left: 30px;
            padding-right: 30px;
        }

        .middle {
            margin-right: auto;
            margin-left: auto;
        }

        .gold {
            background-color: #958443;
        }

        .silver {
            background-color: #8c8c8c;
        }

        .bronze {
            background-color: #5e3d3d;
        }

        @media all and (orientation: portrait) {
            #navbarTitle {
                font-size: 35px;
            }

            #backButton {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div id="navbar">
        <button id="backButton">← Back</button>
        <h1 id="navbarTitle">Leaderboard</h1>
    </div>
    <div id="center">
        <div id="container">
        </div>
    </div>
    </div>

</body>
<script type="module">
    import { getAllUsers } from "./userAPI.js";

    document.getElementById("backButton").addEventListener("click", function () { window.location.href = "/index.html" })

    // Function to add a new ranked item to the leaderboard
    function addRankedItem(rank, name, xp) {
        const container = document.getElementById('container');
        const rankedItem = document.createElement('div');
        rankedItem.classList.add('rankedItem');

        switch (rank) {
            case 1: rankedItem.classList.add('gold');
                break;
            case 2: rankedItem.classList.add('silver');
                break;
            case 3: rankedItem.classList.add('bronze');
                break;
        }

        rankedItem.innerHTML = `
                <p>#${rank}</p>
                <p class="middle">${name}</p>
                <p>${xp} XP</p>
            `;
        container.appendChild(rankedItem);
    }

    async function loadLeaderboard() {
        // Await the promise returned by getAllUsers()
        let userData = await getAllUsers();

        // Iterate through the array once userData is available
        for (var i = 0; i < userData.length; i++) {
            let user = userData[i];
            let userName = user.userName;
            let experience = user.experience;
            experience = Number(experience).toLocaleString();

            addRankedItem(i + 1, userName, experience);
        }

        document.body.style.height = document.documentElement.scrollHeight + 100 + 'px';
    }

    loadLeaderboard();

</script>

</html>
