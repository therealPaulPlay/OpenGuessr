<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <link rel="icon" href="favicon.ico">
    <title>Daily Challenge - OpenGuessr</title>
    <script type="module" src="userAPI.js"></script>
    <style>
        @font-face {
            font-family: Barlow;
            src: url('/FONTS/BarlowCondensed-Medium.ttf');
        }

        h1,
        h2,
        h3 {
            font-weight: 400;
        }

        p {
            color: white;
            font-size: 25px;
            margin: 0;
            margin-top: auto;
            margin-bottom: auto;
            box-sizing: border-box;
        }

        body {
            font-family: Barlow, Futura, Arial, sans-serif;
            font-size: 20px;
            font-weight: 400;
            height: 100%;
            overflow-y: auto;
            background-color: #07071e;
            padding: 0;
            margin: 0;
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            color: inherit;
            height: inherit;
            border: none;
            padding: 0;
            font: inherit;
            cursor: pointer;
            outline: inherit;
        }

        #navbar {
            position: fixed;
            z-index: 100;
            width: 100%;
            align-items: center;
            top: 0;
            display: flex;
            justify-content: space-around;
            height: 100px;
            background-color: rgba(42, 44, 71, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(5, 6, 10, 0.5);
        }

        #navbarTitle {
            position: absolute;
            left: 50%;
            margin: auto;
            font-size: 50px;
            transform: translateX(-50%);
            color: white;
            padding-inline: 20px;
            text-align: center;
        }

        #backButton {
            cursor: pointer;
            transition: filter 250ms ease;
            font-family: Barlow;
            opacity: 100%;
            padding: 10px 20px;
            font-size: 25px;
            color: black;
            width: fit-content;
            height: 50px;
            line-height: 20px;
            background-color: white;
            border-radius: 10px;
            margin: 20px 20px;
            margin-right: auto;
            user-select: none;
            -webkit-user-select: none;
        }

        #backButton:hover {
            filter: brightness(0.7);
        }

        .container {
            position: absolute;
            top: 600px;
            padding: 5px;
            padding-left: 15px;
            padding-right: 15px;
            width: 80vw;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 100px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            text-align: center;
        }

        .yourContainer {
            position: absolute;
            top: 450px;
            padding: 5px;
            padding-left: 15px;
            padding-right: 15px;
            width: 80vw;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            text-align: center;
        }

        .rankedItem {
            display: inline-block;
            width: 100%;
            height: 50px;
            box-sizing: border-box;
            background-color: #4f506f;
            border-radius: 10px;
            margin: 10px 0px;
            display: flex;
            justify-content: space-around;
            padding: 0;
            padding-left: 30px;
            padding-right: 30px;
            white-space: nowrap;
            overflow: hidden;
        }

        .middle {
            margin-right: auto;
            margin-left: auto;
        }

        .gold {
            background-color: #958443;
        }

        .silver {
            background-color: #8c8c8c;
        }

        .bronze {
            background-color: #5e3d3d;
        }

        .yourItem {
            border: solid 5px white;
        }

        .maxlength {
            max-width: 40%;
            text-overflow: none;
            overflow: hidden;
        }

        #topBar {
            text-align: center;
            width: 100%;
            display: flex;
            height: 150px;
            justify-content: center;
            align-items: center;
            margin-top: 100px;
        }

        #topBarTitle {
            width: 80vw;
            max-width: 800px;
            font-size: 35px;
            color: white;
        }

        .infoNote {
            position: absolute;
            top: 250px;
            padding: 5px;
            padding-left: 15px;
            padding-right: 15px;
            width: 80vw;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .infoNote p {
            padding: 5px;
            padding-left: 15px;
            padding-right: 15px;
            padding-bottom: 25px;
            opacity: 50%;
            max-height: 110px;
            overflow-y: auto;
        }

        #infoNoteIcon {
            margin-top: 15px;
            margin-left: 10px;
            width: 35px;
            height: auto;
            opacity: 50%;
        }

        @media all and (orientation: portrait) {
            #navbarTitle {
                font-size: 27px;
            }

            #backButton {
                font-size: 20px;
                padding: 10px 10px;
            }

            p {
                font-size: 20px;
            }

            #topBarTitle {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <div id="navbar">
        <button id="backButton">⭠ Back</button>
        <h1 id="navbarTitle">Daily Challenge</h1>
    </div>
    <div id="topBar">
        <h1 id="topBarTitle">Date: </h1>
    </div>
    <div class="center">
        <div class="yourContainer">
            <div class="rankedItem">
                <p id="yourRank">You: </p>
                <p id="yourName" class="middle">Loading name</p>
                <p id="yourExperience">No result</p>
            </div>
        </div>
        <div class="infoNote">
            <img id="infoNoteIcon" src="./IMG/info_icon.png" alt="Information Icon">
            <p>To play the daily challenge, select the daily challenge category in the "Maps" menu on the main
                screen.</p>
        </div>
        <div id="container" class="container"></div>
    </div>
    </div>

</body>
<script type="module">
    import { getDailyLeaderboard } from "./userAPI.js";

    function inIframe() {
        try {
            return window.self !== window.top;
        } catch (e) {
            return true;
        }
    }

    //set the title to the current date
    const currentDate = new Date();
    const options = { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' };
    const formattedDate = currentDate.toLocaleString('en-US', options);
    document.getElementById("topBarTitle").innerText = "Challenge of " + formattedDate;

    //load the username of the player
    let yourUsername = localStorage.getItem("username") != null ? localStorage.getItem("username") : "Not signed in";
    document.getElementById("yourName").innerHTML = yourUsername;

    let dontLoadStats = false;

    //dont load the stats if the user is not signed in 
    if (localStorage.getItem("username") == null) {
        dontLoadStats = true;
    }

    document.getElementById("backButton").addEventListener("click", () => {
        if (inIframe()) {
            window.top.postMessage("close", "*")
        } else {
            window.location.href = "/index.html";
        }
    });

    let container = document.getElementById('container');

    // Function to add a new ranked item to the leaderboard
    function addRankedItem(rank, name, xp) {
        const rankedItem = document.createElement('div');
        rankedItem.classList.add('rankedItem');

        //draw outline around your rank (if it is on the leaderboard)
        if (name == yourUsername && !dontLoadStats) {
            rankedItem.classList.add('yourItem');
        }

        switch (rank) {
            case 1: rankedItem.classList.add('gold');
                break;
            case 2: rankedItem.classList.add('silver');
                break;
            case 3: rankedItem.classList.add('bronze');
                break;
        }

        rankedItem.innerHTML = `
                <p class="maxlength">#${rank}</p>
                <p class="middle maxlength">${name}</p>
                <p class="maxlength">${xp} Pts.</p>
            `;
        container.appendChild(rankedItem);
    }

    async function loadLeaderboard() {
        // Await the promise returned by getDailyLeaderboard()
        let userData = await getDailyLeaderboard();

        if (userData == undefined) {
            container.innerHTML = "<p>An error occured while loading the challenge leaderboard.</p>";
        } else {
            // Iterate through the array once userData is available
            for (let i = 0; i < userData.length; i++) {
                let user = userData[i];
                let userName = user.userName;
                let lastChallengePoints = user.lastChallengePoints;

                //This would be for loading the players stats from the response (in case they are included)
                if (userName == yourUsername && !dontLoadStats) {

                    document.getElementById("yourExperience").innerHTML = Number(lastChallengePoints).toLocaleString() + " Pts.";
                    document.getElementById("yourRank").innerHTML = "#" + Number(user.position);

                    if (user.position == null || user.position == 0) {
                        document.getElementById("yourRank").innerHTML = "#notPlayed";
                    }
                }

                lastChallengePoints = Number(lastChallengePoints).toLocaleString();

                if (i < 100 && i < (userData.length - 1)) {
                    addRankedItem(i + 1, userName, lastChallengePoints);
                }
            }
        }

        document.body.style.height = document.documentElement.scrollHeight + 100 + 'px';
    }

    loadLeaderboard();

    //Google Analytics 4 (simplified implementation) -------------------------------------------------------------------------
    window['gtag_enable_tcf_support'] = true;

    const imported = document.createElement('script');
    imported.src = "https://www.googletagmanager.com/gtag/js?id=G-DXD64B7ZDX";
    document.head.appendChild(imported);

    try {
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }

        gtag('js', new Date());

        gtag('config', 'G-DXD64B7ZDX', {
            cookie_domain: location.hostname,
            cookie_flags: "SameSite=None; Secure",
        });
    } catch (error) {
        console.error("Error loading GA4: " + error);
    }


</script>

</html>
