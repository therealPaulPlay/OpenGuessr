<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <link rel="icon" href="favicon.ico">
    <script type="module" src="userAPI.js"></script>
    <script type="module" src="signupScreen.js"></script>
    <title>Login / Signup</title>
    <style>
        @font-face {
            font-family: Barlow;
            src: url('/FONTS/BarlowCondensed-Medium.ttf');
        }

        h1,
        h2,
        h3 {
            font-weight: 400;
        }

        p {
            color: white;
        }

        body {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            margin: 0;
            padding: 0;
            font-family: Barlow, Futura, Arial, sans-serif;
            font-size: 20px;
            font-weight: 400;
            background-color: #07071e;
            display: flex;
            justify-content: center;
            align-items: center;
            /* removes everything that is not in visible screen area, this way, it is no longer scrollable */
            overflow: hidden;
        }

        #title1,
        #title2 {
            color: rgba(42, 44, 71, 1);
            font-size: 24px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 5px;
            padding: 5px;
            width: 75%;
        }

        .logo {
            margin: auto;
            width: 275px;
            height: auto;
            margin-bottom: 30px;
            margin-top: 5px;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            width: 300px;
            text-align: center;
            backdrop-filter: blur(1000px);
            transition: all 250ms ease;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .primaryButton {
            transition: all 250ms ease;
            background-color: #ff0808;
            color: white;
            cursor: pointer;
            width: fit-content;
            font-size: 22px;
            font-family: Barlow;
            padding: 5px 15px;
            text-align: center;
            white-space: nowrap;
            transition: all 250ms;
            margin: 2.5px;
            border-radius: 5px;
            user-select: none;
            -webkit-user-select: none;
        }

        .primaryButton:hover {
            filter: brightness(70%);
        }


        .orb {
            position: absolute;
            width: 1500px;
            height: 1200px;
            border-radius: 50%;
            background-color: rgba(255, 59, 48, 0.15);
            /* Red-ish color with decreased opacity */
            filter: blur(1500px);
            /* Blurry effect */
            -webkit-filter: blur(1500px);
            /* Safari compatibility */
            z-index: -1;
            /* Ensure orbs are below other content */
            top: 20%;
            overflow: hidden;
            right: 10%
        }

        #secondOrb {
            position: absolute;
            width: 900px;
            height: 1100px;
            bottom: 20%;
            left: 10%;
        }

        #captchaQuestion {
            color: black;
            background-color: rgba(255, 255, 255, 0.8);
            width: 30%;
            text-align: center;
        }

        #captchaHeader {
            padding: 10px;
            padding-bottom: 15px;
            margin: 0;
            margin-bottom: 30px;
            text-wrap: wrap;
            font-size: 24px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 5px;
            color: rgba(42, 44, 71, 1);
            margin-left: 34px;
            margin-right: 34px;
        }

        #errorMessage {
            color: red;
            display: none;
        }

        @keyframes floatOrb {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0.05;
            }

            50% {
                transform: translateY(-200px) translateX(200px);
                opacity: 0.025;
            }

            100% {
                transform: translateY(0) translateX(-200px);
                opacity: 0.05;
            }
        }

        .secondaryButton {
            transition: all 250ms ease;
            background-color: white;
            color: black;
            cursor: pointer;
            width: fit-content;
            font-size: 20px;
            font-family: Barlow;
            padding: 5px 15px;
            text-align: center;
            white-space: nowrap;
            transition: all 250ms;
            margin: 2.5px;
            margin-left: 10px;
            border-radius: 5px;
            user-select: none;
            -webkit-user-select: none;
        }

        #back {
            background-color: white;
            color: black;
        }

        .secondaryButton:hover {
            filter: brightness(70%);
        }

        a:link {
            color: #FFFFFF;
        }

        a:visited {
            color: #FFFFFF;
        }

        a:hover {
            color: #FFFFFF;
        }

        #privacyNotice {
            opacity: 50%;
            margin-bottom: 0;
        }

        input {
            color: white;
            background: rgba(42, 44, 71, 1);
            border-radius: 5px;
            font-size: 18px;
            padding: 15px;
            outline: none;
            box-shadow: none;
            border: none;
            font-family: Barlow;
            width: calc(80% - 20px);
        }

        textarea:focus,
        input:focus {
            outline: none;
        }

        .password-container {
            position: relative;
            margin-bottom: 20px;
        }

        .switchFormBox {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            padding: 8px;
            margin-top: 50px;
        }

        .toggle-password {
            position: absolute;
            right: -14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 30px;
            height: auto;
            opacity: 0.75;
        }

        .toggle-password.hide-eye {
            content: url('/IMG/eyeclosed.png');
        }

        .toggle-password.show-eye {
            content: url('/IMG/eyeopen.png');
        }

        .wrapper {
            padding-top: 10px;
            padding-bottom: 10px;
        }

        #backButton  {
            margin: 0;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 7px;
            width: 100%;
            min-height: 50px;
        }

        .containerBottom {
            margin-top: 10px; 
            padding: 5px;
            min-width: 330px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <img class="logo" src="/IMG/openguessr.svg" alt="OpenGuessr Logo">
            <div id="loginForm">
                <div>
                    <input id="login_email" type="email" placeholder="Email"><br><br>
                    <input id="login_password" type="password" placeholder="Password"><br><br>
                    <button id="login" class="primaryButton">Login</button>
                </div>
                <p class="switchFormBox">Don't have an account?
                    <button id="loginSwitch" class="secondaryButton">Sign up</button>
                </p>
            </div>
            <div id="signupForm" style="display: none;">
                <div>
                    <div id="signup_area">
                        <input id="signup_username" type="text" placeholder="Username"><br><br>
                        <input id="signup_email" type="email" placeholder="Email"><br><br>
                        <div class="password-container">
                            <input id="signup_password" type="password" placeholder="Password">
                            <img class="toggle-password" src="/IMG/eyeclosed.png" alt="Show Password">
                        </div>
                    </div>
                    <div id="captcha">
                        <h2 id="captchaHeader">Can you answer the default question?</h2>
                        <input id="captchaQuestion" type="number" min="0" max="10" placeholder="0 - 10"><br><br>
                    </div>
                    <button id="back" class="primaryButton">back</button>
                    <button id="signup" class="primaryButton">Sign Up (1/2)</button>
                </div>
                <p class="switchFormBox">Already have an account?
                    <button id="loginSwitchBack" class="secondaryButton">Login</button>
                </p>
                <p id="privacyNotice">Our <a href="/legal.html">privacy policy</a> applies.</p>
            </div>
            <p id="errorMessage"> This is an error message box. </p>
        </div>
        <div class="container containerBottom">
            <button id="backButton" class="secondaryButton">⭠ Return to OpenGuessr</button>
        </div>
    </div>
    <div class="orb"></div>
    <div id="secondOrb" class="orb"></div>
</body>
</html>
